<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATELIER VÉRITÉ — Thời Trang Haute Couture & May Mặc Kiến Trúc Đương Đại</title>
    <meta name="description" content="Thương hiệu thời trang Haute Couture đương đại, may đo kiến trúc và phụ kiện thủ công cao cấp. Trải nghiệm mua sắm xa xỉ với ThreeUI." />

    <!-- Synchronous anti-FOUC theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('atelier_theme');
          var pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var theme = (saved === 'dark' || saved === 'light') ? saved : pref;
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts for Luxury Editorial Typography with Vietnamese support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Italiana&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-ivory-50 text-noir-900 dark:bg-[#0b0b0e] dark:text-[#f2f2f4] antialiased selection:bg-[#d4af37]/30 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
