# Docker Compose Production Override
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  frontend:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      NODE_ENV: production
      APP_ENV: production
      REQUIRE_MONGO_TRANSACTIONS: "true"
      MONGO_CONNECTIONSTRING: ${MONGO_CONNECTIONSTRING:-mongodb://mongo:27017/webfashion_prod?replicaSet=rs0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLIENT_URL: ${CLIENT_URL:-https://atelier-verite.local}
      FRONTEND_URL: ${FRONTEND_URL:-https://atelier-verite.local}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      ACTION_SECRET: ${ACTION_SECRET:-}
      OTP_SECRET: ${OTP_SECRET:-}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    environment:
      NODE_ENV: production
      APP_ENV: production
      MONGO_CONNECTIONSTRING: ${MONGO_CONNECTIONSTRING:-mongodb://mongo:27017/webfashion_prod?replicaSet=rs0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok || rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
