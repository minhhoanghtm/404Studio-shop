# Docker Compose Production Override
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  frontend:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      NODE_ENV: production
      APP_ENV: production
      REQUIRE_MONGO_TRANSACTIONS: "true"
      MONGO_CONNECTIONSTRING: ${MONGO_RS_CONNECTIONSTRING:-mongodb://${COMPOSE_MONGO_HOST:-mongo}:${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}/${MONGO_DATABASE:?MONGO_DATABASE is required}?replicaSet=${MONGO_RS_NAME:-rs0}}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://${COMPOSE_REDIS_HOST:-redis}:${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      ACTION_SECRET: ${ACTION_SECRET:?ACTION_SECRET is required}
      OTP_SECRET: ${OTP_SECRET:?OTP_SECRET is required}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    environment:
      NODE_ENV: production
      APP_ENV: production
      MONGO_CONNECTIONSTRING: ${MONGO_RS_CONNECTIONSTRING:-mongodb://${COMPOSE_MONGO_HOST:-mongo}:${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}/${MONGO_DATABASE:?MONGO_DATABASE is required}?replicaSet=${MONGO_RS_NAME:-rs0}}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://${COMPOSE_REDIS_HOST:-redis}:${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    command: ["mongod", "--replSet", "${MONGO_RS_NAME:-rs0}", "--port", "${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port $${MONGO_INTERNAL_PORT} --quiet --eval \"try { rs.status().ok || rs.initiate({_id:'$${MONGO_RS_NAME:-rs0}',members:[{_id:0,host:'$${COMPOSE_MONGO_HOST:-mongo}:$${MONGO_INTERNAL_PORT}'}]}).ok } catch (e) { rs.initiate({_id:'$${MONGO_RS_NAME:-rs0}',members:[{_id:0,host:'$${COMPOSE_MONGO_HOST:-mongo}:$${MONGO_INTERNAL_PORT}'}]}).ok }\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    command: ["redis-server", "--port", "${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
