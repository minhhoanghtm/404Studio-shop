services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ""
        VITE_APP_ENV: ${APP_ENV:-production}
        FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT:?FRONTEND_INTERNAL_PORT is required}
        BACKEND_HOST: ${COMPOSE_BACKEND_HOST:-backend}
        BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
    container_name: atelier_frontend
    ports:
      - "${NGINX_HTTP_PORT:?NGINX_HTTP_PORT is required}:${FRONTEND_INTERNAL_PORT:?FRONTEND_INTERNAL_PORT is required}"
    environment:
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT:?FRONTEND_INTERNAL_PORT is required}
      BACKEND_HOST: ${COMPOSE_BACKEND_HOST:-backend}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:$${FRONTEND_INTERNAL_PORT}/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
    container_name: atelier_backend
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}"
    environment:
      PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
      BACKEND_PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
      BACKEND_HOST: ${COMPOSE_BACKEND_HOST:-backend}
      BACKEND_BIND_HOST: ${BACKEND_BIND_HOST:-0.0.0.0}
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-local}
      BASE_URL: ${BACKEND_URL:-http://${BACKEND_HOST:?BACKEND_HOST is required}:${BACKEND_PORT}}
      BACKEND_URL: ${BACKEND_URL:-http://${BACKEND_HOST}:${BACKEND_PORT}}
      FRONTEND_HOST: ${FRONTEND_HOST:?FRONTEND_HOST is required}
      FRONTEND_PORT: ${NGINX_HTTP_PORT:?NGINX_HTTP_PORT is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      MONGO_HOST: ${COMPOSE_MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}
      MONGO_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      MONGO_CONNECTIONSTRING: ${COMPOSE_MONGO_CONNECTIONSTRING:-mongodb://mongo:${MONGO_INTERNAL_PORT}/${MONGO_DATABASE}}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}}
      REDIS_HOST: ${COMPOSE_REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev_access_token_secret_minimum_32_characters_123456}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_token_secret_minimum_32_characters_123456}
      ACTION_SECRET: ${ACTION_SECRET:-dev_action_secret_key_minimum_32_characters_123456}
      OTP_SECRET: ${OTP_SECRET:-dev_otp_secret_key_minimum_32_characters_123456}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.BACKEND_PORT + '/api/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: atelier_worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-local}
      MONGO_HOST: ${COMPOSE_MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}
      MONGO_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      MONGO_CONNECTIONSTRING: ${COMPOSE_MONGO_CONNECTIONSTRING:-mongodb://mongo:${MONGO_INTERNAL_PORT}/${MONGO_DATABASE}}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}}
      REDIS_HOST: ${COMPOSE_REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        AI_SERVICE_INTERNAL_PORT: ${AI_SERVICE_INTERNAL_PORT:?AI_SERVICE_INTERNAL_PORT is required}
    container_name: atelier_ai_service
    ports:
      - "${AI_SERVICE_PORT:?AI_SERVICE_PORT is required}:${AI_SERVICE_INTERNAL_PORT:?AI_SERVICE_INTERNAL_PORT is required}"
    environment:
      AI_SERVICE_HOST: ${AI_SERVICE_HOST:-0.0.0.0}
      AI_SERVICE_PORT: ${AI_SERVICE_INTERNAL_PORT:?AI_SERVICE_INTERNAL_PORT is required}
      NODE_BACKEND_BASE_URL: http://${COMPOSE_BACKEND_HOST:-backend}:${BACKEND_INTERNAL_PORT:?BACKEND_INTERNAL_PORT is required}
      AI_SERVICE_SHARED_SECRET: ${AI_SERVICE_SHARED_SECRET:-dev_shared_secret_key_minimum_32_characters_123456}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:$${AI_SERVICE_PORT}/health/liveness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7.0
    container_name: atelier_mongo
    command: ["mongod", "--port", "${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:?MONGO_PORT is required}:${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}"
    volumes:
      - mongo-data:/data/db
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--port", "${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: atelier_redis
    command: ["redis-server", "--port", "${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}"]
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}"
    volumes:
      - redis-data:/data
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  atelier-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
