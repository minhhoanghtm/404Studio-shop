services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atelier_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atelier_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:8080
      CLIENT_URL: http://localhost:8080
      MONGO_CONNECTIONSTRING: mongodb://mongo:27017/webfashion_dev
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCESS_TOKEN_SECRET: dev_access_token_secret_minimum_32_characters_123456
      REFRESH_TOKEN_SECRET: dev_refresh_token_secret_minimum_32_characters_123456
      ACTION_SECRET: dev_action_secret_key_minimum_32_characters_123456
      OTP_SECRET: dev_otp_secret_key_minimum_32_characters_123456
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: atelier_worker
    environment:
      NODE_ENV: development
      MONGO_CONNECTIONSTRING: mongodb://mongo:27017/webfashion_dev
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: atelier_ai_service
    ports:
      - "8081:8081"
    environment:
      AI_SERVICE_PORT: 8081
      NODE_BACKEND_BASE_URL: http://backend:5000
      AI_SERVICE_SHARED_SECRET: ${AI_SERVICE_SHARED_SECRET:-dev_shared_secret_key_minimum_32_characters_123456}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8081/health/liveness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7.0
    container_name: atelier_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: atelier_redis
    ports:
      - "26379:6379"
    volumes:
      - redis-data:/data
    networks:
      - atelier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  atelier-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
