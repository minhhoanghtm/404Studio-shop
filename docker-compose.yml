services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_CONNECTIONSTRING: mongodb://mongo:27017/webfashion_dev
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ACCESS_TOKEN_SECRET: dev_access_token_secret_minimum_32_characters_123456
      REFRESH_TOKEN_SECRET: dev_refresh_token_secret_minimum_32_characters_123456
      ACTION_SECRET: dev_action_secret_key_minimum_32_characters_123456
      OTP_SECRET: dev_otp_secret_key_minimum_32_characters_123456
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
