name: atelier-qa

services:
  mongo:
    image: mongo:7.0
    container_name: atelier_qa_mongo
    command: ["mongod", "--port", "${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}", "--bind_ip_all"]
    ports:
      - "${MONGO_HOST:?MONGO_HOST is required}:${MONGO_PORT:?MONGO_PORT is required}:${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}"
    volumes:
      - atelier_qa_mongo_data:/data/db
    networks: [atelier-qa-network]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "${MONGO_INTERNAL_PORT:?MONGO_INTERNAL_PORT is required}", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: atelier_qa_redis
    command: ["redis-server", "--port", "${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}"]
    ports:
      - "${REDIS_HOST:?REDIS_HOST is required}:${REDIS_PORT:?REDIS_PORT is required}:${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}"
    volumes:
      - atelier_qa_redis_data:/data
    networks: [atelier-qa-network]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_INTERNAL_PORT:?REDIS_INTERNAL_PORT is required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  atelier-qa-network:
    name: atelier-qa-network

volumes:
  atelier_qa_mongo_data:
  atelier_qa_redis_data:
