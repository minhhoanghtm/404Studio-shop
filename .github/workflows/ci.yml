name: CI Quality Gates & Security

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# Principle of least privilege
permissions:
  contents: read

# Concurrency management: cancel running jobs on newer commits to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: SECURITY SCANNING & DEPENDENCY AUDIT ──────────────────────────────
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Frontend Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

  # ── JOB 2: FRONTEND LINT, TYPECHECK, UNIT TESTS & PRODUCTION BUILD ───────────
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm install --no-audit --no-fund

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Typecheck TypeScript Strict Mode
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Verify Bundle has Zero Secrets
        run: |
          if grep -rn "sk-or-v1-" dist/ 2>/dev/null; then
            echo "ERROR: Secret detected in client bundle!"
            exit 1
          fi

  # ── JOB 3: BACKEND STATIC CHECKS & TESTS ─────────────────────────────────────
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install --no-audit --no-fund

      - name: Backend Lint
        working-directory: ./backend
        run: npm run lint || true

  # ── JOB 4: DOCKER CONTAINER VERIFICATION ─────────────────────────────────────
  docker:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      - name: Build Frontend Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: atelier-verite/frontend:ci-test

      - name: Build Backend Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atelier-verite/backend:ci-test

  # ── JOB 5: PLAYWRIGHT E2E & CONSENT NETWORK AUDIT ────────────────────────────
  e2e:
    name: Playwright E2E & Legal Privacy Suite
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Legal Compliance Suite
        run: npx playwright test e2e/privacyCompliance.spec.ts --project="Desktop Viewport"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
