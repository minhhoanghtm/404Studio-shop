name: CI Quality Gates & Security

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'ci/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# Principle of least privilege
permissions:
  contents: read

# Concurrency management: cancel running jobs on newer commits to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: SECURITY SCANNING & DEPENDENCY AUDIT ──────────────────────────────
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Dependency Vulnerability Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  # ── JOB 2: FRONTEND LINT, TYPECHECK, UNIT TESTS & PRODUCTION BUILD ───────────
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Typecheck TypeScript Strict Mode
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Verify Bundle has Zero Secrets
        run: |
          if grep -rn "sk-or-v1-" dist/ 2>/dev/null; then
            echo "ERROR: Secret detected in client bundle!"
            exit 1
          fi

  # ── JOB 3: BACKEND STATIC CHECKS & UNIT TESTS ────────────────────────────────
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --no-audit --no-fund

      - name: Backend Lint
        run: npm run lint

      - name: Run Backend Pure Unit Tests (Jest)
        run: npm run test:unit

      - name: Generate Ephemeral CI Test Secrets for Node Tests
        run: |
          {
            echo "ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "ACTION_SECRET=$(openssl rand -hex 32)"
            echo "OTP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Run Backend Deterministic Node Unit Tests
        run: |
          node --test --test-force-exit \
            src/modules/ai/__tests__/designOperations.controller.node.test.mjs \
            src/modules/ai/__tests__/designOperations.security.node.test.mjs \
            src/modules/ai/__tests__/designPayload.validator.node.test.mjs \
            src/modules/ai/__tests__/revenueSummary.node.test.mjs

  # ── JOB 4: CHECKOUT ATOMICITY (ISOLATED MONGO REPLICA SET + REDIS) ───────────
  backend-atomicity:
    name: Backend Checkout Atomicity & RS Transactions
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Isolated CI MongoDB Standalone, Replica Set & Redis
        run: |
          docker run -d --name ci_redis -p 127.0.0.1:6381:6379 redis:7-alpine
          docker run -d --name ci_mongo_standalone -p 127.0.0.1:27018:27017 mongo:7.0
          docker run -d --name ci_mongo_rs -p 127.0.0.1:27019:27019 mongo:7.0 mongod --replSet rs0 --port 27019 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec ci_mongo_rs mongosh --port 27019 --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec ci_mongo_rs mongosh --port 27019 --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27019'}]})"
          for i in $(seq 1 30); do
            if docker exec ci_mongo_rs mongosh --port 27019 --quiet --eval "quit(rs.status().myState === 1 ? 0 : 1)" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --no-audit --no-fund

      - name: Generate Ephemeral CI Test Runtime Configuration
        run: |
          {
            echo "QA_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "ACTION_SECRET=$(openssl rand -hex 32)"
            echo "OTP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Run Checkout Atomicity Integration Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          APP_ENV: qa
          QA_E2E_ENABLED: "true"
          QA_API_URL: http://127.0.0.1:5002/api
          MONGO_CONNECTIONSTRING: mongodb://127.0.0.1:27018/atelier_verite_qa
          LOCAL_DEV_MONGO_URI: mongodb://127.0.0.1:27018/atelier_verite_qa
          QA_RS_MONGO_URI: mongodb://127.0.0.1:27019/atelier_verite_qa_rs?replicaSet=rs0
          REDIS_URL: redis://127.0.0.1:6381
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6381"
        run: node --test --test-force-exit src/modules/orders/checkoutAtomicity.qa.integration.node.test.mjs

      - name: Cleanup Isolated CI Containers
        if: always()
        run: docker rm -f ci_redis ci_mongo_standalone ci_mongo_rs || true

  # ── JOB 5: DOCKER CONTAINER VERIFICATION ─────────────────────────────────────
  docker:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend, backend-atomicity]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose -f compose.qa.yaml config --quiet
          docker compose -f compose.qa-rs.yaml config --quiet

      - name: Build Frontend Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: atelier-verite/frontend:ci-test

      - name: Build Backend Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atelier-verite/backend:ci-test

      - name: Build Worker Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          tags: atelier-verite/worker:ci-test

  # ── JOB 6: PLAYWRIGHT E2E & CONSENT NETWORK AUDIT ────────────────────────────
  e2e:
    name: Playwright E2E & Legal Privacy Suite
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Legal Compliance Suite
        run: npx playwright test --config=playwright.ci.config.ts --project="Desktop Viewport"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
