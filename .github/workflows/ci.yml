name: CI Quality Gates & Security

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'ci/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# Principle of least privilege
permissions:
  contents: read

# Concurrency management: cancel running jobs on newer commits to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: SECURITY SCANNING, HARDCODED-PORT GUARD & DEPENDENCY AUDIT ─────────
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Guard Against Hardcoded Ports
        run: node scripts/check-hardcoded-ports.mjs

      - name: Frontend Dependency Vulnerability Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  # ── JOB 2: FRONTEND LINT, TYPECHECK, UNIT TESTS & PRODUCTION BUILD ───────────
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        working-directory: .
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Typecheck TypeScript Strict Mode
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Verify Bundle has Zero Secrets
        run: |
          if grep -rn "sk-or-v1-" dist/ 2>/dev/null; then
            echo "ERROR: Secret detected in client bundle!"
            exit 1
          fi

  # ── JOB 3: BACKEND STATIC CHECKS & UNIT TESTS ────────────────────────────────
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        working-directory: .
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Start Isolated CI Redis
        working-directory: .
        run: |
          docker run -d --name ci_backend_redis \
            -p "${REDIS_HOST}:${REDIS_PORT}:${REDIS_INTERNAL_PORT}" \
            redis:7-alpine redis-server --port "${REDIS_INTERNAL_PORT}"
          for i in $(seq 1 20); do
            if docker exec ci_backend_redis redis-cli -p "${REDIS_INTERNAL_PORT}" ping >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --no-audit --no-fund

      - name: Backend Lint
        run: npm run lint

      - name: Run Backend Pure Unit Tests (Jest)
        run: npm run test:unit

      - name: Generate Ephemeral CI Test Secrets for Node Tests
        run: |
          {
            echo "ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "ACTION_SECRET=$(openssl rand -hex 32)"
            echo "OTP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Run Backend Deterministic Node Unit Tests
        run: |
          node --test --test-force-exit \
            src/modules/ai/__tests__/designOperations.controller.node.test.mjs \
            src/modules/ai/__tests__/designOperations.security.node.test.mjs \
            src/modules/ai/__tests__/designPayload.validator.node.test.mjs \
            src/modules/ai/__tests__/revenueSummary.node.test.mjs \
            src/configs/__tests__/network.config.node.test.mjs

      - name: Cleanup Isolated CI Redis
        if: always()
        run: docker rm -f ci_backend_redis || true

  # ── JOB 4: CHECKOUT ATOMICITY (ISOLATED MONGO REPLICA SET + REDIS) ───────────
  backend-atomicity:
    name: Backend Checkout Atomicity & RS Transactions
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        run: |
          grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"
          set -a && source .env.ci && set +a
          {
            echo "REDIS_HOST=${QA_REDIS_HOST}"
            echo "REDIS_PORT=${QA_REDIS_PORT}"
            echo "REDIS_URL=${QA_REDIS_URL}"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Isolated CI MongoDB Standalone, Replica Set & Redis
        run: |
          docker run -d --name ci_redis \
            -p "${REDIS_HOST}:${REDIS_PORT}:${REDIS_INTERNAL_PORT}" \
            redis:7-alpine redis-server --port "${REDIS_INTERNAL_PORT}"
          docker run -d --name ci_mongo_standalone \
            -p "${MONGO_HOST}:${MONGO_PORT}:${MONGO_INTERNAL_PORT}" \
            mongo:7.0 mongod --port "${MONGO_INTERNAL_PORT}" --bind_ip_all
          docker run -d --name ci_mongo_rs \
            -p "${MONGO_RS_HOST}:${MONGO_RS_PORT}:${MONGO_RS_INTERNAL_PORT}" \
            mongo:7.0 mongod --replSet "${MONGO_RS_NAME}" --port "${MONGO_RS_INTERNAL_PORT}" --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec ci_mongo_rs mongosh --port "${MONGO_RS_INTERNAL_PORT}" --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec ci_mongo_rs mongosh --port "${MONGO_RS_INTERNAL_PORT}" --quiet --eval "rs.initiate({_id:'${MONGO_RS_NAME}',members:[{_id:0,host:'${MONGO_RS_HOST}:${MONGO_RS_PORT}'}]})"
          for i in $(seq 1 30); do
            if docker exec ci_mongo_rs mongosh --port "${MONGO_RS_INTERNAL_PORT}" --quiet --eval "quit(rs.status().myState === 1 ? 0 : 1)" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --no-audit --no-fund

      - name: Generate Ephemeral CI Test Runtime Configuration
        run: |
          {
            echo "QA_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "ACCESS_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "ACTION_SECRET=$(openssl rand -hex 32)"
            echo "OTP_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Run Checkout Atomicity Integration Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          APP_ENV: qa
          QA_E2E_ENABLED: "true"
          LOCAL_DEV_MONGO_URI: ${{ env.MONGO_CONNECTIONSTRING }}
        run: node --test --test-force-exit src/modules/orders/checkoutAtomicity.qa.integration.node.test.mjs

      - name: Cleanup Isolated CI Containers
        if: always()
        run: docker rm -f ci_redis ci_mongo_standalone ci_mongo_rs || true

  # ── JOB 5: DOCKER CONTAINER VERIFICATION ─────────────────────────────────────
  docker:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend, backend-atomicity]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          export ACCESS_TOKEN_SECRET="$(openssl rand -hex 32)"
          export REFRESH_TOKEN_SECRET="$(openssl rand -hex 32)"
          export ACTION_SECRET="$(openssl rand -hex 32)"
          export OTP_SECRET="$(openssl rand -hex 32)"
          docker compose --env-file .env.ci -f compose.yaml config --quiet
          docker compose --env-file .env.ci -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml config --quiet
          docker compose --env-file .env.ci -f compose.qa.yaml config --quiet
          docker compose --env-file .env.ci -f compose.qa-rs.yaml config --quiet

      - name: Build Frontend Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: atelier-verite/frontend:ci-test
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_API_URL=${{ env.VITE_API_BASE_URL }}
            VITE_APP_ENV=${{ env.APP_ENV }}
            FRONTEND_INTERNAL_PORT=${{ env.FRONTEND_INTERNAL_PORT }}
            BACKEND_HOST=backend
            BACKEND_INTERNAL_PORT=${{ env.BACKEND_INTERNAL_PORT }}

      - name: Build Backend Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atelier-verite/backend:ci-test
          build-args: |
            BACKEND_INTERNAL_PORT=${{ env.BACKEND_INTERNAL_PORT }}

      - name: Build Worker Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          tags: atelier-verite/worker:ci-test

      - name: Build AI Service Docker Image (Dry-Run Cache Test)
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: atelier-verite/ai-service:ci-test
          build-args: |
            AI_SERVICE_INTERNAL_PORT=${{ env.AI_SERVICE_INTERNAL_PORT }}

  # ── JOB 6: AI SERVICE BUILD & UNIT TESTS ─────────────────────────────────────
  ai-service:
    name: AI Service Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        working-directory: .
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ai-service/package-lock.json

      - name: Install AI Service Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript AI Service
        run: npm run build

      - name: Run AI Service Vitest Suite
        run: npm run test

  # ── JOB 7: PLAYWRIGHT E2E & CONSENT NETWORK AUDIT ────────────────────────────
  e2e:
    name: Playwright E2E & Legal Privacy Suite
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        working-directory: .
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Legal Compliance Suite
        run: npx playwright test --config=playwright.ci.config.ts --project="Desktop Viewport"

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  # ── JOB 8: MONOREPO DEV STARTUP & ESM ENV REGRESSION SMOKE ───────────────────
  dev-startup-smoke:
    name: Dev Startup & ESM ENV Smoke
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-service]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load CI ENV Configuration
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start Isolated CI MongoDB & Redis
        run: |
          docker run -d --name ci_smoke_redis \
            -p "${REDIS_HOST}:${REDIS_PORT}:${REDIS_INTERNAL_PORT}" \
            redis:7-alpine redis-server --port "${REDIS_INTERNAL_PORT}"
          docker run -d --name ci_smoke_mongo \
            -p "${MONGO_HOST}:${MONGO_PORT}:${MONGO_INTERNAL_PORT}" \
            mongo:7.0 mongod --port "${MONGO_INTERNAL_PORT}" --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec ci_smoke_redis redis-cli -p "${REDIS_INTERNAL_PORT}" ping >/dev/null 2>&1 \
              && docker exec ci_smoke_mongo mongosh --port "${MONGO_INTERNAL_PORT}" --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Install Monorepo Dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix ai-service ci --no-audit --no-fund

      - name: Run Dev Startup & ENV Fail-Fast Smoke Suite
        env:
          SMOKE_WITH_BACKEND: "true"
        run: |
          export ACCESS_TOKEN_SECRET="$(openssl rand -hex 32)"
          export REFRESH_TOKEN_SECRET="$(openssl rand -hex 32)"
          export ACTION_SECRET="$(openssl rand -hex 32)"
          export OTP_SECRET="$(openssl rand -hex 32)"
          export AI_SERVICE_SHARED_SECRET="$(openssl rand -hex 32)"
          npm run test:startup

      - name: Cleanup Isolated CI Smoke Containers
        if: always()
        run: docker rm -f ci_smoke_redis ci_smoke_mongo || true
