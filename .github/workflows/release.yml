name: Release & Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load Non-Secret Network Configuration
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Compose Production Config
        run: |
          export ACCESS_TOKEN_SECRET="$(openssl rand -hex 32)"
          export REFRESH_TOKEN_SECRET="$(openssl rand -hex 32)"
          export ACTION_SECRET="$(openssl rand -hex 32)"
          export OTP_SECRET="$(openssl rand -hex 32)"
          docker compose --env-file .env.ci -f compose.yaml -f compose.prod.yaml config --quiet

  build-release-images:
    name: Build OCI Release Images
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Load Non-Secret Network Configuration
        run: grep -E '^[A-Z0-9_]+=' .env.ci >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: atelier-verite/frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_API_URL=${{ env.VITE_API_BASE_URL }}
            FRONTEND_INTERNAL_PORT=${{ env.FRONTEND_INTERNAL_PORT }}
            BACKEND_HOST=backend
            BACKEND_INTERNAL_PORT=${{ env.BACKEND_INTERNAL_PORT }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atelier-verite/backend:${{ github.ref_name }}
          build-args: |
            BACKEND_INTERNAL_PORT=${{ env.BACKEND_INTERNAL_PORT }}
